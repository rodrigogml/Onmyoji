name: Telegram outbound — desenvolvimento

on:
  push:
    branches:
      - feature/sdd-telegram-outbound-*
  pull_request:
    paths:
      - "onmyoji-daemon/**"
      - ".github/workflows/telegram-dev-tests.yml"

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install testing dependencies
        run: python -m pip install --disable-pip-version-check -e 'onmyoji-daemon[test]'
      - name: Compile changed Python modules
        run: |
          python -m py_compile onmyoji-daemon/src/onmyoji_daemon/telegram.py
          python -m py_compile onmyoji-daemon/src/onmyoji_daemon/telegram_channels.py
      - name: Run Telegram subsystem regression tests
        env:
          PYTHONPATH: onmyoji-daemon/src
        run: python -m pytest -q onmyoji-daemon/tests/test_telegram.py onmyoji-daemon/tests/test_telegram_channels.py onmyoji-daemon/tests/test_mcp_telegram.py
      - name: Report full offline suite (advisory; other integrations have separate dependencies and baseline failures)
        continue-on-error: true
        env:
          PYTHONPATH: onmyoji-daemon/src
        run: python -m pytest -q
