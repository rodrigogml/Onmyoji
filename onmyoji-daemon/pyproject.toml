[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onmyoji-daemon"
version = "0.1.0"
description = "Supervisor local extensível de serviços do Onmyōji"
requires-python = ">=3.11"

[project.optional-dependencies]
windows = ["pywin32>=306"]
test = ["pytest>=8"]

[project.scripts]
onmyoji-daemon = "onmyoji_daemon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
