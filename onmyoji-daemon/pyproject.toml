[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onmyoji-daemon"
version = "0.1.0"
description = "Supervisor local extensível de serviços do Onmyōji"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "boto3>=1.34.113,<2", "cryptography>=42,<47", "paramiko>=3.4,<5", "pykeepass>=4.1,<5", "IMAPClient>=3,<4", "jsonschema>=4,<5", "croniter>=7,<8", "tzdata>=2024.1"]

[project.optional-dependencies]
windows = ["pywin32>=306"]
excel = ["pywin32>=306; sys_platform == 'win32'"]
test = ["pytest>=8", "jsonschema>=4,<5"]
documents = ["PyMuPDF==1.26.7", "pypdf==6.1.1", "reportlab==4.4.4", "openpyxl==3.1.5", "pyHanko==0.31.0", "Pillow>=12.1,<14"]

[project.scripts]
onmyoji-daemon = "onmyoji_daemon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"onmyoji_daemon.agent_notification" = ["schemas/*.json"]
"onmyoji_daemon.mcp.btg" = ["api_contracts.json"]
"onmyoji_daemon.file_review" = ["assets/*.html", "assets/*.js", "assets/*.css"]
