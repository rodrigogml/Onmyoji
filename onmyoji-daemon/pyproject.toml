[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onmyoji-daemon"
version = "0.1.0"
description = "Supervisor local extensível de serviços do Onmyōji"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "cryptography>=42,<47"]

[project.optional-dependencies]
windows = ["pywin32>=306"]
test = ["pytest>=8", "jsonschema>=4,<5", "pykeepass>=4.1,<5"]

[project.scripts]
onmyoji-daemon = "onmyoji_daemon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"onmyoji_daemon.mcp.btg" = ["api_contracts.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
